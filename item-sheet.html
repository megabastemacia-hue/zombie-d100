<form class="{{cssClass}}" autocomplete="off">

  <header class="sheet-header">
    <h1>
      <input name="name" type="text" value="{{item.name}}" placeholder="Nom de l'objet"/>
    </h1>
  </header>

  <section class="sheet-body">

    <!-- ========================= -->
    <!-- TYPE D'ARME -->
    <!-- ========================= -->

    {{#if isWeapon}}

    <div class="form-group">
      <label>Type d'arme</label>

      <select name="system.typeArme">

        <option value="tir"
          {{#if (eq system.typeArme "tir")}}selected{{/if}}>
          Arme à feu
        </option>

        <option value="melee"
          {{#if (eq system.typeArme "melee")}}selected{{/if}}>
          Corps à corps
        </option>

      </select>
    </div>

    <div class="form-group">
      <label>Bonus</label>
      <input type="number" name="system.bonus" value="{{system.bonus}}"/>
    </div>

    <div class="form-group">
      <label>Portée</label>
      <input type="text" name="system.portee" value="{{system.portee}}"/>
    </div>

    <!-- ========================= -->
    <!-- ARMES A FEU UNIQUEMENT -->
    <!-- ========================= -->

    {{#unless (eq system.typeArme "melee")}}

    <div class="form-group">
      <label>Modes autorisés</label>
      <input type="text"
             name="system.modesAutorises"
             value="{{system.modesAutorises}}"
             placeholder="semi,burst,auto"/>
    </div>

    <div class="form-group">
      <label>Mode actuel</label>

      <select name="system.modeTirActuel">

        <option value="semi"
          {{#if (eq system.modeTirActuel "semi")}}selected{{/if}}>
          Semi-auto
        </option>

        <option value="burst"
          {{#if (eq system.modeTirActuel "burst")}}selected{{/if}}>
          Rafale
        </option>

        <option value="auto"
          {{#if (eq system.modeTirActuel "auto")}}selected{{/if}}>
          Automatique
        </option>

      </select>
    </div>

    <div class="form-group">
      <label>Munitions</label>
      <input type="number" name="system.munitions" value="{{system.munitions}}"/>
    </div>

    <div class="form-group">
      <label>Chargeur max</label>
      <input type="number" name="system.chargeur" value="{{system.chargeur}}"/>
    </div>

    <div class="form-group">
      <label>Type de munition</label>
      <input type="text" name="system.typeMunition" value="{{system.typeMunition}}"/>
    </div>

    {{/unless}}

    {{/if}}

    <!-- ========================= -->
    <!-- EQUIPEMENT -->
    <!-- ========================= -->

    {{#if isEquipment}}

    <div class="form-group">
      <label>Slot</label>

      <select name="system.slot">

        <option value="head"
          {{#if (eq system.slot "head")}}selected{{/if}}>
          Tête
        </option>

        <option value="body"
          {{#if (eq system.slot "body")}}selected{{/if}}>
          Corps
        </option>

        <option value="hands"
          {{#if (eq system.slot "hands")}}selected{{/if}}>
          Mains
        </option>

        <option value="feet"
          {{#if (eq system.slot "feet")}}selected{{/if}}>
          Pieds
        </option>

        <option value="bag"
          {{#if (eq system.slot "bag")}}selected{{/if}}>
          Sac
        </option>

        <option value="primary"
          {{#if (eq system.slot "primary")}}selected{{/if}}>
          Main principale
        </option>

        <option value="secondary"
          {{#if (eq system.slot "secondary")}}selected{{/if}}>
          Main secondaire
        </option>

        <option value="accessory"
          {{#if (eq system.slot "accessory")}}selected{{/if}}>
          Accessoire
        </option>

      </select>
    </div>

    <div class="form-group">
      <label>FOR</label>
      <input type="number" name="system.modFor" value="{{system.modFor}}"/>
    </div>

    <div class="form-group">
      <label>AGI</label>
      <input type="number" name="system.modAgi" value="{{system.modAgi}}"/>
    </div>

    <div class="form-group">
      <label>INT</label>
      <input type="number" name="system.modInt" value="{{system.modInt}}"/>
    </div>

    <div class="form-group">
      <label>PER</label>
      <input type="number" name="system.modPer" value="{{system.modPer}}"/>
    </div>

    <div class="form-group">
      <label>STR</label>
      <input type="number" name="system.modStr" value="{{system.modStr}}"/>
    </div>

    <div class="form-group">
      <label>COMBAT</label>
      <input type="number" name="system.modCombat" value="{{system.modCombat}}"/>
    </div>

    <div class="form-group">
      <label>TIR</label>
      <input type="number" name="system.modTir" value="{{system.modTir}}"/>
    </div>

    {{/if}}

    <!-- ========================= -->
    <!-- OBJETS UTILISABLES -->
    <!-- ========================= -->

    {{#if isUsable}}

    <div class="form-group">
      <label>Quantité</label>
      <input type="number" name="system.quantite" value="{{system.quantite}}"/>
    </div>

    <div class="form-group">
      <label>Stress</label>
      <input type="number" name="system.stressMod" value="{{system.stressMod}}"/>
    </div>

    <div class="form-group">
      <label>Faim</label>
      <input type="number" name="system.faimMod" value="{{system.faimMod}}"/>
    </div>

    <div class="form-group">
      <label>Soif</label>
      <input type="number" name="system.soifMod" value="{{system.soifMod}}"/>
    </div>

    {{/if}}

    <!-- ========================= -->
    <!-- STATUTS -->
    <!-- ========================= -->

    {{#if isStatus}}

    <div class="form-group">
      <label>FOR</label>
      <input type="number" name="system.modFor" value="{{system.modFor}}"/>
    </div>

    <div class="form-group">
      <label>AGI</label>
      <input type="number" name="system.modAgi" value="{{system.modAgi}}"/>
    </div>

    <div class="form-group">
      <label>INT</label>
      <input type="number" name="system.modInt" value="{{system.modInt}}"/>
    </div>

    <div class="form-group">
      <label>PER</label>
      <input type="number" name="system.modPer" value="{{system.modPer}}"/>
    </div>

    <div class="form-group">
      <label>STR</label>
      <input type="number" name="system.modStr" value="{{system.modStr}}"/>
    </div>

    <div class="form-group">
      <label>COMBAT</label>
      <input type="number" name="system.modCombat" value="{{system.modCombat}}"/>
    </div>

    <div class="form-group">
      <label>TIR</label>
      <input type="number" name="system.modTir" value="{{system.modTir}}"/>
    </div>

    {{/if}}

    <!-- ========================= -->
    <!-- DESCRIPTION -->
    <!-- ========================= -->

    <div class="form-group stacked">
      <label>Description</label>

      <textarea name="system.description"
                rows="6">{{system.description}}</textarea>
    </div>

  </section>

</form>
